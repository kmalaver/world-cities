name: Release workflow
on:
  push:
    tags:
      - 'v*' 

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -o ./bin/exporter .

      - name: Run tests
        run: go test ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: exporter-binary
          path: ./bin/exporter

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        format: [ 'psql', 'json']
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: exporter-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/exporter

      - name: Export data
        run: ./bin/exporter -format ${{ matrix.format }} -output ./output_${{ matrix.format }}
     
      - name: Compress
        run: tar -czvf output_${{ matrix.format }}.tar.gz output_${{ matrix.format }}

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with: 
          files: |
            output_${{ matrix.format }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}